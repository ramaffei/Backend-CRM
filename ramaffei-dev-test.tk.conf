<VirtualHost 45.162.169.65:80>
    SuexecUserGroup "#1001" "#1001"
    ServerName ramaffei-dev-test.tk
    ServerAlias www.ramaffei-dev-test.tk
    ServerAlias admin.ramaffei-dev-test.tk
    ServerAlias ramaffei-dev-test.tk.vxsct605.avnam.net
    ServerAlias www.ramaffei-dev-test.tk.vxsct605.avnam.net
    DocumentRoot /home/ramaffei/public_html
    ErrorLog /var/log/virtualmin/ramaffei-dev-test.tk_error_log
    CustomLog /var/log/virtualmin/ramaffei-dev-test.tk_access_log combined
    ScriptAlias /cgi-bin/ /home/ramaffei/cgi-bin/
    ScriptAlias /awstats/ /home/ramaffei/cgi-bin/
    DirectoryIndex index.php index.php4 index.php5 index.htm index.html
    <Directory /home/ramaffei/public_html>
        Options -Indexes +IncludesNOEXEC +SymLinksIfOwnerMatch +ExecCGI
        allow from all
        AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
        Require all granted
        AddType application/x-httpd-php .php
        AddHandler fcgid-script .php
        AddHandler fcgid-script .php7.4
        FCGIWrapper /home/ramaffei/fcgi-bin/php7.4.fcgi .php
        FCGIWrapper /home/ramaffei/fcgi-bin/php7.4.fcgi .php7.4
    </Directory>
    <Directory /home/ramaffei/cgi-bin>
        allow from all
        AllowOverride All Options=ExecCGI,Includes,IncludesNOEXEC,Indexes,MultiViews,SymLinksIfOwnerMatch
        Require all granted
    </Directory>
    RedirectMatch /webmail([^/]*)(.*) https://vxsct605.avnam.net/webmail2/
    RedirectMatch /phpmyadmin([^/]*)(.*) https://vxsct605.avnam.net/phpmyadmin78/
    RewriteEngine on
    RewriteCond %{HTTP_HOST} =webmail.ramaffei-dev-test.tk
    RewriteRule ^(?!/.well-known)(.*) https://ramaffei-dev-test.tk:20000/ [R]
    RewriteCond %{HTTP_HOST} =admin.ramaffei-dev-test.tk
    RewriteRule ^(?!/.well-known)(.*) https://ramaffei-dev-test.tk:10000/ [R]
    RemoveHandler .php
    RemoveHandler .php7.4
    FcgidMaxRequestLen 1073741824
    <Files awstats.pl>
        AuthName "ramaffei-dev-test.tk statistics"
        AuthType Basic
        AuthUserFile /home/ramaffei/.awstats-htpasswd
        require valid-user
    </Files>
    Alias /dav /home/ramaffei/public_html
    <Location /dav>
        DAV on
        AuthType Basic
        AuthName ramaffei-dev-test.tk
        AuthUserFile /home/ramaffei/etc/dav.digest.passwd
        Require valid-user
        ForceType text/plain
        Satisfy All
        RemoveHandler .php
        RemoveHandler .php7.4
        RewriteEngine off
    </Location>
</VirtualHost>
